name: Build iOS Simulator App

# Compile a KMP + SwiftUI project for the SIMULATOR and report the result as a
# GitHub issue. Runs here rather than in the source repo because this repo is
# public, and public repos get GitHub-hosted runners free — including macOS,
# which bills at 10x on a private repo.
#
# The source repo can be private: it is checked out with SOURCE_REPO_TOKEN and
# never published. Compiler output goes to Telegram, not to the public log.
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'owner/repo to build (may be private)'
        required: true
        default: 'oranblock/skirmish-multiplatform'
      ref:
        description: 'branch, tag or SHA'
        required: true
        default: 'main'
      scheme:
        description: 'Xcode scheme'
        required: false
        default: 'iosApp'
      xcodegen:
        description: 'Run xcodegen first (project.yml is the source of truth)'
        required: false
        default: 'true'
      gradle_task:
        description: 'Gradle task producing the XCFramework (blank to skip)'
        required: false
        default: 'assembleSharedKitReleaseXCFramework'
      prebuild:
        description: 'Script to run before xcodebuild, relative to the source root (e.g. iosApp/fetch-filament.sh). Blank to skip.'
        required: false
        default: ''
      runner:
        description: 'Runner image. macos-15 carries Xcode 16; macos-14 tops out at 15.4.'
        required: false
        default: 'macos-15'
      xcode:
        description: 'Xcode major version to select (e.g. 16). Blank uses the image default.'
        required: false
        default: '16'

concurrency:
  # Keyed by what is actually being built, not by the workflow name. A single
  # global group meant dispatching an Xcode 15.4 run silently CANCELLED the
  # Xcode 16 run of the same commit — and comparing two toolchains is exactly
  # what this workflow is for.
  group: build-ios-sim-${{ inputs.source_repo }}-${{ inputs.ref }}-${{ inputs.runner }}-${{ inputs.xcode }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

    steps:
      - name: Select Xcode
        if: inputs.xcode != ''
        run: |
          set -euo pipefail
          # The toolchain is part of the result. Xcode 15.4 (Swift 5.10) rejects
          # main-actor isolation patterns that Xcode 16 (Swift 6) accepts, so a
          # build can "fail" purely because the runner is older than the machine
          # the project is developed on. Pin it, and print what was used.
          APP=$(ls -d /Applications/Xcode_${{ inputs.xcode }}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$APP" ]; then
            echo "::warning::no Xcode ${{ inputs.xcode }} on this image; using default"
          else
            sudo xcode-select -s "$APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout source project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src
          fetch-depth: 1

      - name: Record what we are building
        id: meta
        working-directory: src
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)"              >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build shared XCFramework
        id: xcf
        if: inputs.gradle_task != ''
        working-directory: src
        run: |
          # `set +e`: GitHub invokes this with `bash -e`, so a failing build would
          # exit the step before rc is captured and nothing useful gets reported.
          set +e
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          # Output goes to a FILE, not to the public job log: a Kotlin or Swift
          # error prints source lines, and this repo is public while the source
          # is not. The log is delivered privately via Telegram instead.
          ./gradlew ${{ inputs.gradle_task }} --no-daemon \
            > "$GITHUB_WORKSPACE/out/gradle.log" 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          grep -E 'BUILD SUCCESSFUL|BUILD FAILED' "$GITHUB_WORKSPACE/out/gradle.log" | tail -1 || true
          exit $rc

      - name: Generate Xcode project
        if: inputs.xcodegen == 'true'
        working-directory: src/iosApp
        run: |
          set -euo pipefail
          # No Homebrew dependency: the release zip drops a binary in ~/.local.
          mkdir -p "$HOME/tmp/xg" && cd "$HOME/tmp/xg"
          curl -sL -o xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          unzip -oq xg.zip && cd xcodegen && PREFIX="$HOME/.local" ./install.sh
          cd "$GITHUB_WORKSPACE/src/iosApp"
          "$HOME/.local/bin/xcodegen" generate

      - name: Pre-build script
        if: inputs.prebuild != ''
        working-directory: src
        run: |
          set -euo pipefail
          # Large binary dependencies are usually fetched, not vendored — this
          # project keeps Filament's prebuilts out of git and pulls them here.
          # Without this the build fails with "no XCFramework found", which
          # looks like a code error and is not one.
          chmod +x "${{ inputs.prebuild }}"
          cd "$(dirname "${{ inputs.prebuild }}")"
          "./$(basename "${{ inputs.prebuild }}")"

      - name: Build for simulator
        id: build
        working-directory: src/iosApp
        run: |
          set +e   # see the note on the gradle step
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          PROJ=$(ls -d *.xcodeproj | head -1)
          xcodebuild -project "$PROJ" -scheme "${{ inputs.scheme }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO build \
            > "$GITHUB_WORKSPACE/out/xcodebuild.log" 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Only the verdict and an error COUNT reach the public log.
          grep -cE 'error:' "$GITHUB_WORKSPACE/out/xcodebuild.log" | sed 's/^/error lines: /' || true
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' "$GITHUB_WORKSPACE/out/xcodebuild.log" || true
          exit $rc

      - name: Package simulator app
        if: success()
        id: pkg
        run: |
          set -euo pipefail
          APP=$(find src/iosApp/dd/Build/Products -maxdepth 2 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          BASE=$(basename "${APP%.app}")
          ZIP="$GITHUB_WORKSPACE/out/${BASE}-sim-${{ steps.meta.outputs.sha }}.zip"
          (cd "$(dirname "$APP")" && zip -qr "$ZIP" "$(basename "$APP")")
          echo "zip=${BASE}-sim-${{ steps.meta.outputs.sha }}.zip" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$ZIP" | cut -f1)" >> "$GITHUB_OUTPUT"
          lipo -info "$APP/$BASE" 2>/dev/null || true

      - name: Send logs to Telegram (private)
        if: always()
        run: |
          set -uo pipefail
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || { echo "no telegram secrets, skipping"; exit 0; }
          STATUS="${{ job.status }}"
          ICON='❌'; [ "$STATUS" = success ] && ICON='✅'
          for f in out/gradle.log out/xcodebuild.log; do
            [ -f "$f" ] || continue
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document="@${f}" \
              -F caption="${ICON} ${STATUS} · $(basename "$f") · ${{ inputs.source_repo }}@${{ steps.meta.outputs.sha }}" \
              -o /dev/null || true
          done

      - name: Stash logs in a secret gist
        id: gist
        if: always() && env.GIST_TOKEN != ''
        run: |
          # `set +e` FIRST. GitHub runs this with `bash -e`, and the loop below ends
          # each iteration with `[ -f "$f" ] && ...` — which returns 1 when a log is
          # missing and killed the whole step in 0.09s with no output at all.
          set +e
          set -uo pipefail
          # Compiler output quotes private source, so it must not go in the
          # public job log or the issue. A SECRET gist is owned by the account,
          # unlisted, and readable with a `gist`-scoped token — which is how a
          # maintainer (or an agent working on their behalf) reads the errors
          # without the token ever passing through a chat window.
          command -v gh >/dev/null || brew install gh
          FILES=""
          for f in out/xcodebuild.log out/gradle.log; do
            if [ -f "$f" ]; then FILES="$FILES $f"; fi
          done
          [ -n "$FILES" ] || { echo "no logs to stash"; exit 0; }
          # Trim to the parts worth reading: full logs are tens of thousands of
          # lines and a gist has limits.
          mkdir -p out/trimmed
          for f in $FILES; do
            { grep -nE 'error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)' "$f" | head -200
              echo "--- tail ---"
              tail -60 "$f"; } > "out/trimmed/$(basename "$f")"
          done
          URL=$(GH_TOKEN="$GIST_TOKEN" gh gist create --secret \
                  -d "iOS sim build ${{ inputs.source_repo }}@${{ steps.meta.outputs.sha }} ($(date -u +%FT%TZ))" \
                  out/trimmed/* 2>&1 | tail -1)
          case "$URL" in
            https://gist.github.com/*)
              echo "gist=$URL" >> "$GITHUB_OUTPUT"
              echo "logs stashed (secret gist created)" ;;
            *)
              # Report the failure instead of silently producing no link — the last
              # three runs each lost their gist this way and nobody could tell why.
              echo "::warning::gist creation failed: $URL" ;;
          esac
          exit 0

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.zip }}
          path: out/*.zip
          retention-days: 14

      - name: Report as issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            const sha = '${{ steps.meta.outputs.sha }}';
            const subject = ${{ toJSON(steps.meta.outputs.subject) }};
            const repo = '${{ inputs.source_repo }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Error TEXT is deliberately NOT included: this repo is public and
            // compiler errors quote private source. Counts and file names only;
            // the full logs went to Telegram.
            let detail = '';
            for (const f of ['out/xcodebuild.log', 'out/gradle.log']) {
              if (!fs.existsSync(f)) continue;
              const lines = fs.readFileSync(f, 'utf8').split('\n');
              const errs = lines.filter(l => /error:/.test(l));
              const files = [...new Set(errs
                .map(l => (l.match(/([A-Za-z0-9_+-]+\.(swift|kt|m|mm|h)):/) || [])[1])
                .filter(Boolean))];
              detail += `\n**${f}** — ${errs.length} error line(s)`;
              if (files.length) detail += `\nfiles: ${files.map(x => '`' + x + '`').join(', ')}`;
              detail += '\n';
            }

            const title = `${ok ? '✅' : '❌'} iOS sim build · ${repo}@${sha}`;
            const body = [
              `**${ok ? 'BUILD SUCCEEDED' : 'BUILD FAILED'}**`,
              ``,
              `| | |`,
              `|---|---|`,
              `| source | \`${repo}\` @ \`${sha}\` |`,
              `| commit | ${subject} |`,
              `| scheme | \`${{ inputs.scheme }}\` |`,
              `| run | [${context.runId}](${runUrl}) |`,
              ok ? `| artifact | \`${{ steps.pkg.outputs.zip }}\` (${{ steps.pkg.outputs.size }}) |` : ``,
              ``,
              detail,
              ``,
              '${{ steps.gist.outputs.gist }}' ? `**Full log (secret gist):** ${{ steps.gist.outputs.gist }}` : ``,
              ``,
              `<sub>Error text is not posted here: this repo is public and compiler errors quote private source. Full logs go to Telegram and, when GIST_TOKEN is set, to a secret gist linked above.</sub>`,
            ].filter(Boolean).join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
