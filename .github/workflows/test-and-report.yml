name: iOS Simulator Test & Report

# Point this at ANY iOS simulator build. Nothing here is app-specific: the app
# comes in by URL, the bundle id by input, and what to do with it by flow file.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Direct download URL for a SIMULATOR build (.zip containing a .app). Leave blank if using artifact_run_id.'
        required: false
        default: ''
      artifact_run_id:
        description: 'Run id of a Build iOS Simulator App run in THIS repo to take the .app from. Preferred over app_url — artifacts need auth, so a plain URL cannot fetch them.'
        required: false
        default: ''
      bundle_id:
        description: 'Bundle identifier, e.g. com.example.myapp'
        required: true
      flow:
        description: 'Flow file under flows/ (without .sh)'
        required: false
        default: 'smoke'
      device:
        description: 'Simulator device name'
        required: false
        default: 'iPhone 16'
      runner:
        description: 'Runner image. Both macos-14 and macos-15 are Apple Silicon with paravirtualised Metal; what differs is the SIMULATOR RUNTIME, which is where feature gaps like argument buffers live.'
        required: false
        default: 'macos-14'
      xcode:
        description: 'Xcode major version to select (e.g. 16). Blank uses the image default.'
        required: false
        default: ''
  workflow_call:
    inputs:
      app_url: { required: false, type: string, default: '' }
      artifact_run_id: { required: false, type: string, default: '' }
      bundle_id: { required: true, type: string }
      flow: { required: false, type: string, default: 'smoke' }
      device: { required: false, type: string, default: 'iPhone 16' }
      runner: { required: false, type: string, default: 'macos-14' }
      xcode: { required: false, type: string, default: '' }
    secrets:
      TELEGRAM_BOT_TOKEN: { required: false }
      TELEGRAM_CHAT_ID: { required: false }

concurrency:
  # Keyed by what is being tested. A group of just the ref meant dispatching a
  # diagnose run silently CANCELLED an in-flight video run of the same app —
  # the same mistake already fixed in the build workflow and not carried across.
  group: ios-test-${{ inputs.bundle_id }}-${{ inputs.flow }}-${{ inputs.runner }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 45

    env:
      # Never echo these. Passed to curl via -F only; see scripts/lib.sh.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      FLOW: ${{ inputs.flow || 'smoke' }}
      DEVICE: ${{ inputs.device || 'iPhone 16' }}

    steps:
      - name: Select Xcode
        if: inputs.xcode != ''
        run: |
          set -euo pipefail
          APP=$(ls -d /Applications/Xcode_${{ inputs.xcode }}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$APP" ]; then
            echo "::warning::no Xcode ${{ inputs.xcode }} on this image; using default"
          else
            sudo xcode-select -s "$APP/Contents/Developer"
          fi
          xcodebuild -version
          # The simulator RUNTIME is the thing that matters for Metal feature gaps,
          # so record which one is actually installed.
          xcrun simctl list runtimes | grep -i ios || true

      - uses: actions/checkout@v4

      - name: Install idb (optional)
        id: idb
        continue-on-error: true
        run: |
          set +e
          # Homebrew now refuses third-party taps by default ("Refusing to load
          # formula ... from untrusted tap"), which killed this step outright.
          # idb is only needed for TAPS and rotation — launch, screenshot and the
          # crash assertions are pure simctl — so it is optional and the flows
          # degrade rather than the job dying.
          export HOMEBREW_NO_INSTALL_FROM_API=1
          brew tap facebook/fb 2>/dev/null
          HOMEBREW_ALLOW_UNTRUSTED_TAPS=1 brew install facebook/fb/idb-companion
          pipx install fb-idb || pip3 install --break-system-packages fb-idb
          if command -v idb >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::idb unavailable — tap/swipe/rotate steps will be skipped"
          fi
          exit 0

      - name: Boot simulator
        run: |
          set -euo pipefail
          # Runner images change their preinstalled devices without warning, so
          # take the requested device, then ANY iPhone, rather than failing on a
          # hardcoded model that quietly disappeared.
          UDID=$(xcrun simctl list devices available \
                 | grep -m1 "$DEVICE (" | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$UDID" ]; then
            echo "::warning::'$DEVICE' not available; falling back to first available iPhone"
            UDID=$(xcrun simctl list devices available \
                   | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          fi
          [ -n "$UDID" ] || { echo "::error::no iPhone simulator available"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          if command -v idb >/dev/null 2>&1; then idb connect "$UDID" || true; fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Fetch app from a build run
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Actions artifacts are not publicly fetchable — `curl` on the UI link gets
          # HTML, not a zip. Downloading through gh keeps the app private and means
          # the build and the test do not have to share a hosting bucket.
          mkdir -p app_dir
          gh run download "${{ inputs.artifact_run_id }}" --repo "${{ github.repository }}" --dir app_dir
          for z in app_dir/*.zip app_dir/*/*.zip; do
            [ -f "$z" ] && unzip -oq "$z" -d app_dir/
          done
          true

      - name: Download & install app
        run: |
          set -euo pipefail
          mkdir -p app_dir
          if [ -n "${{ inputs.app_url }}" ]; then
            curl -fSL "${{ inputs.app_url }}" -o app_dir/app.zip
            unzip -q app_dir/app.zip -d app_dir/
          fi
          APP_PATH=$(find app_dir -maxdepth 3 -name '*.app' | head -n1)
          [ -n "$APP_PATH" ] || { echo "::error::no .app inside the archive"; exit 1; }
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Prepare report dir
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          REPORT_DIR="report_${TIMESTAMP}"
          mkdir -p "$REPORT_DIR/screenshots" "$REPORT_DIR/logs" "$REPORT_DIR/crashes"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

      - name: Start log stream
        run: |
          set -euo pipefail
          # nohup so the later kill actually reaches `log stream` rather than
          # just the wrapping shell.
          nohup xcrun simctl spawn "$UDID" log stream \
            --style compact --predicate "process == \"$BUNDLE_ID\"" \
            > "$REPORT_DIR/logs/app_process.log" 2>&1 &
          echo "LOG_PID=$!" >> "$GITHUB_ENV"

      - name: Run flow
        run: |
          set -euo pipefail
          [ -f "flows/${FLOW}.sh" ] || { echo "::error::flows/${FLOW}.sh not found"; exit 1; }
          chmod +x scripts/lib.sh "flows/${FLOW}.sh"
          ./flows/"${FLOW}".sh

      - name: Package report
        if: always()
        run: |
          set +e
          set -uo pipefail
          # Guarded: when an earlier step fails, REPORT_DIR may never have been set,
          # and this step then failed too — turning one real error into four noisy
          # ones and leaving upload-artifact with no path at all.
          if [ -z "${REPORT_DIR:-}" ]; then
            echo "no report dir — the run failed before setup"
            REPORT_DIR="report_orphan"; TIMESTAMP="${TIMESTAMP:-orphan}"
            mkdir -p "$REPORT_DIR"
            echo "run failed before the report directory existed" > "$REPORT_DIR/README.txt"
            echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
            echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          fi
          kill "$LOG_PID" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/* "$REPORT_DIR/crashes/" 2>/dev/null || true
          # A crash file is the single most useful thing in the archive, so
          # surface it in the job log rather than burying it in a zip.
          if [ -n "$(ls -A "$REPORT_DIR/crashes/" 2>/dev/null)" ]; then
            echo "::warning::crash reports captured — see the archive"
          fi
          ARCHIVE_NAME="debug_report_${TIMESTAMP}.zip"
          zip -qr "$ARCHIVE_NAME" "$REPORT_DIR"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
          exit 0

      - name: Send report to Telegram
        if: always()
        run: |
          set -uo pipefail
          [ -f "${ARCHIVE_NAME:-}" ] || { echo "no archive to send"; exit 0; }
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set — skipping send (the artifact still has everything)."
            exit 0
          fi
          STATUS="${{ job.status }}"
          ICON='❌'; [ "$STATUS" = success ] && ICON='✅'
          CAPTION="${ICON} <b>${STATUS}</b>%0A📅 ${TIMESTAMP}%0A📦 <code>${BUNDLE_ID}</code>%0A🎬 flow: <code>${FLOW}</code>"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document="@${ARCHIVE_NAME}" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML" -o /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-report-${{ env.TIMESTAMP || github.run_id }}
          path: ${{ env.ARCHIVE_NAME || 'report_*' }}
          if-no-files-found: warn
          retention-days: 14
